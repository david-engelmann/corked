[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "corked"
version = "0.1.0"
description = "The agent with taste that sends back ugly code and says why"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
corked = "corked.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
